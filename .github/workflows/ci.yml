name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv sync
      - run: uv run ruff check .

  sast:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv sync
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql
      - name: Semgrep
        run: |
          uvx semgrep scan --config auto --config p/owasp-top-ten --config p/python --config p/docker --severity ERROR --error --sarif --output semgrep.sarif || echo "SEMGREP_FAILED=1" >> "$GITHUB_ENV"
      - uses: github/codeql-action/upload-sarif@v3
        if: ${{ !cancelled() }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Fail on Semgrep findings
        run: test -z "${SEMGREP_FAILED:-}"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency audit
        # `uvx pip-audit` would audit pip-audit's own isolated tool environment, not this
        # project's dependencies. `uv run` audits the synced project environment.
        run: uv run --with pip-audit pip-audit

  test:
    runs-on: ubuntu-latest
    needs: sast
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv sync
      - run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=100 --junitxml=junit-test.xml -q
      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: ${{ !cancelled() }}
        with:
          name: test tests
          path: junit-test.xml
          reporter: java-junit

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv sync
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: weather-trends:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # trivy-action tags are v-prefixed; a bare `0.28.0` is not a resolvable ref and aborts the
      # job at setup. v0.36.0 pins Trivy v0.70.0, the engine .trivyignore is written against —
      # older engines do not enumerate pip's vendored SBOM at all, so they pass it vacuously.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: weather-trends:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
